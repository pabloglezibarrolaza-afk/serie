<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1B19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1B19; --s1:#232321; --s2:#2C2C29; --s3:#353531; --line:#3A3A35;
  --tx:#ECEAE4; --mu:#9C998F; --mu2:#6F6C64;
  --ac:#6CB4FF; --ac-ink:#06131F; --ac-soft:rgba(108,180,255,.14);
  --ok:#6CB4FF; --bad:#E5775B;
  --r:14px; --mono:'Geist Mono',ui-monospace,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font-family:Geist,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:35;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 16px calc(var(--safe-b) + 150px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.eyebrow{font-size:12px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;font-weight:500}
h1{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:4px}
h2{font-size:13px;font-weight:500;color:var(--mu);letter-spacing:.06em;text-transform:uppercase;margin:26px 0 10px}
h3{font-size:16px;font-weight:600;letter-spacing:-.01em}

/* chips de día */
.dias{position:relative;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 16px;padding:0 16px}
.dias::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 12px;border-radius:10px;background:var(--s1);border:1px solid var(--line);color:var(--mu);font-size:13px;font-weight:500;transition:background .15s,color .15s,transform .1s}
.chip b{font-family:var(--mono);font-weight:600;color:var(--tx);margin-right:6px}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.chip.on b{color:var(--ac-ink)}
.chip:active{transform:scale(.97)}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:10px}

/* ejercicio */
.ej-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.meta{color:var(--mu);font-size:13px;margin-top:2px}
.cuenta{font-family:var(--mono);font-size:12px;color:var(--mu);padding:3px 7px;border-radius:7px;background:var(--s2);white-space:nowrap}
.cuenta.hecho{background:var(--ac-soft);color:var(--ac)}
.info{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.info .k{color:var(--mu2)}
.sug{color:var(--ac)}
.nota{font-size:12.5px;color:var(--mu);margin-top:8px;font-style:italic}
.series{margin-top:12px;display:grid;gap:6px}
.fila{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:6px;align-items:center}
.fila .n{font-family:var(--mono);font-size:12px;color:var(--mu2);text-align:center}
.campo{position:relative}
.campo input{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--s2);padding:0 34px 0 12px;font-family:var(--mono);font-size:17px;font-weight:500;outline:none;transition:border-color .15s}
.campo input:focus{border-color:var(--ac)}
.campo input::placeholder{color:var(--mu2)}
.campo span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--mu2);pointer-events:none}
.ok{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--s2);display:grid;place-items:center;transition:background .15s,transform .1s}
.ok svg{width:20px;height:20px;stroke:var(--mu);stroke-width:2.4;fill:none}
.ok:active{transform:scale(.94)}
.fila.hecha .campo input{background:transparent;border-color:transparent;color:var(--tx)}
.fila.hecha .ok{background:var(--ac);border-color:var(--ac)}
.fila.hecha .ok svg{stroke:var(--ac-ink)}
.fila.pr .n{color:var(--ac)}
.acciones{display:flex;gap:14px;margin-top:10px;font-size:13px;color:var(--mu)}
.acciones button{padding:4px 0}
.acciones button:active{color:var(--tx)}
.ej.saltado{opacity:.45}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:12px;font-weight:600;font-size:15px;background:var(--s2);border:1px solid var(--line);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.btn.peq{height:40px;font-size:14px;width:auto;padding:0 14px}
.btn.peligro{color:var(--bad)}
.fila-btn{display:flex;gap:8px}

/* barra de sesión */
.guardado{display:flex;gap:12px;align-items:center;margin-bottom:16px;border-color:var(--ac)}
.guardado .ok-g{flex:0 0 36px;height:36px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.guardado .ok-g svg{width:20px;height:20px;stroke:var(--ac-ink);stroke-width:2.6;fill:none}
.guardado b{display:block;font-size:15px}.guardado small{color:var(--mu);font-size:13px}
.hecho-g{width:64px;height:64px;border-radius:50%;background:var(--ac);display:grid;place-items:center;margin:6px auto 14px;animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
.hecho-g svg{width:34px;height:34px;stroke:var(--ac-ink);stroke-width:2.6;fill:none}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.sesion{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:10px 14px}
.sesion .t{font-family:var(--mono);font-size:20px;font-weight:600}
.punto{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-right:8px;animation:lat 1.6s ease-in-out infinite}
@keyframes lat{50%{opacity:.3}}

/* descanso */
#descanso{position:fixed;left:50%;bottom:calc(var(--safe-b) + 76px);transform:translate(-50%,20px);opacity:0;pointer-events:none;width:calc(100% - 32px);max-width:528px;background:var(--s3);border:1px solid var(--line);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:10px;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#descanso.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#descanso .t{font-family:var(--mono);font-size:22px;font-weight:600;flex:1}
#descanso .t small{font-family:Geist;font-size:12px;color:var(--mu);font-weight:500;margin-right:8px;letter-spacing:.04em;text-transform:uppercase}
#descanso .bar{position:absolute;left:0;bottom:0;height:2px;background:var(--ac);border-radius:2px;transition:width 1s linear}
#descanso.fin{background:var(--ac);color:var(--ac-ink)}
#descanso.fin small{color:var(--ac-ink)}

/* pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(27,27,25,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 8px calc(var(--safe-b) + 6px);display:flex;justify-content:center;z-index:30}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;color:var(--mu2);font-weight:500}
nav.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.on svg{stroke:var(--ac)}

/* progreso */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:12px}
.kpi .v{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:-.02em}
.kpi .v small{font-size:13px;color:var(--mu);font-weight:500}
.kpi .l{font-size:12px;color:var(--mu);margin-top:2px}
.lista{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item:active{background:var(--s2)}
.item .c{flex:1;min-width:0}
.item .c b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .c small{color:var(--mu);font-size:12.5px}
.item .d{text-align:right;font-family:var(--mono);font-size:14px;font-weight:600}
.item .d small{display:block;font-family:Geist;font-weight:400;font-size:11.5px;color:var(--mu)}
.spark{width:64px;height:26px;flex:0 0 auto}
.vacio{color:var(--mu);font-size:14px;padding:22px 14px;text-align:center}
.heroe .grande-p{font-family:var(--mono);font-size:44px;font-weight:600;letter-spacing:-.03em;color:var(--ac);line-height:1.05;margin:6px 0 6px}
.musculos{display:grid;gap:4px}
.mus{display:grid;grid-template-columns:72px 1fr 64px;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:8px 4px;border-radius:10px}
.mus:active{background:var(--s2)}
.mus .n{font-weight:600;font-size:14px}
.mus .barra-m{height:10px;border-radius:6px;background:var(--s2);overflow:hidden}
.mus .barra-m i{display:block;height:100%;border-radius:6px;background:var(--ac)}
.mus .v{text-align:right;font-weight:600;font-size:14px}
.mus small{grid-column:2/4;color:var(--mu);font-size:11.5px;margin-top:3px}
.cal-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-cab div{text-align:center}.cal-cab b{display:block;font-size:15px}.cal-cab small{color:var(--mu);font-size:12px}
.cal-cab button{width:40px;height:40px;border-radius:10px;background:var(--s2);font-size:22px;line-height:1;color:var(--tx)}
.cal-cab button:disabled{opacity:.3}
.cal-sem,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-sem span{text-align:center;font-size:11px;color:var(--mu2);padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;color:var(--mu2)}
.cd b{font-weight:500;font-family:var(--mono)}
.cd.si{background:var(--ac-soft);color:var(--tx);border:1px solid rgba(108,180,255,.35)}
.cd.si b{color:var(--ac);font-weight:600}
.cd.si small{font-size:9.5px;color:var(--mu);font-family:var(--mono)}
.cd.si:active{transform:scale(.94)}
.cd.hoy{outline:1.5px solid var(--tx);outline-offset:-1.5px}
.semanas{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:10px}
.semanas div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.semanas i{display:block;width:100%;border-radius:5px;background:var(--s3);min-height:4px}
.semanas i.ok{background:var(--ac)}
.semanas span{font-size:10px;color:var(--mu2);font-family:var(--mono)}

/* hoja */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#velo.on{opacity:1;pointer-events:auto}
#hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;padding:10px 16px calc(var(--safe-b) + 24px);z-index:41;transition:transform .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#hoja.on{transform:translate(-50%,0)}
#hoja .asa{width:38px;height:4px;border-radius:4px;background:var(--s3);margin:0 auto 14px}
.grafico{width:100%;height:150px;display:block;margin:6px 0 4px}
.tabla{width:100%;border-collapse:collapse;font-size:13.5px}
.tabla td{padding:8px 0;border-top:1px solid var(--line)}
.tabla td:last-child{text-align:right;font-family:var(--mono)}

/* rutina */
.edit-dia{padding:0;overflow:hidden}
.edit-dia .cab{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.edit-dia .cab .id{font-family:var(--mono);font-weight:600;color:var(--ac);width:44px;background:transparent;border:0;outline:0}
.edit-dia .cab .nom{flex:1;background:transparent;border:0;outline:0;font-weight:600;min-width:0}
.ex{display:grid;grid-template-columns:1fr 50px 74px 30px;gap:6px;padding:8px 10px 8px 14px;align-items:center}
.ex+.ex{border-top:1px solid var(--line)}
.ex input{background:var(--s2);border:1px solid transparent;border-radius:8px;height:36px;padding:0 8px;outline:none;min-width:0;width:100%;font-size:14px}
.ex input:focus{border-color:var(--ac)}
.ex input.c{text-align:center;font-family:var(--mono)}
.x{color:var(--mu2);font-size:20px;line-height:1;height:36px}
.x:active{color:var(--bad)}
.ex-cab{display:grid;grid-template-columns:1fr 50px 74px 30px;gap:6px;padding:8px 10px 0 14px;font-size:11px;color:var(--mu2);text-transform:uppercase;letter-spacing:.05em}
.añadir{width:100%;padding:12px;color:var(--ac);font-size:14px;font-weight:500;border-top:1px solid var(--line)}

/* herramientas */
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{font-size:12px;color:var(--mu);display:block;margin-bottom:4px}
.form input,.form select{width:100%;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--s2);padding:0 12px;font-family:var(--mono);outline:none}
.res{margin-top:12px;font-size:14px}
.res .grande{font-family:var(--mono);font-size:30px;font-weight:600;color:var(--ac);letter-spacing:-.02em}
.discos{display:flex;align-items:center;gap:3px;margin-top:10px;height:70px}
.discos .barra{height:8px;width:40px;background:var(--mu2);border-radius:2px}
.disco{border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ac-ink)}
.texto{font-size:13.5px;color:var(--mu);line-height:1.55}
.texto b{color:var(--tx);font-weight:500}

#bicho{position:fixed;left:0;top:0;width:132px;height:132px;z-index:25;pointer-events:none;transform:translate(-200px,120vh);transition-property:transform;transition-timing-function:cubic-bezier(.3,.9,.3,1);will-change:transform}
#bocadillo{position:fixed;left:0;top:0;max-width:230px;background:#ECEAE4;color:#1B1B19;font-size:13.5px;line-height:1.35;font-weight:500;padding:9px 12px;border-radius:14px;z-index:26;pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);transform-origin:bottom right;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
#bocadillo.on{opacity:1;transform:none}
#bocadillo::after{content:'';position:absolute;bottom:-5px;left:var(--cola,28px);width:12px;height:12px;background:#ECEAE4;transform:rotate(45deg);border-radius:2px}
#logro{position:fixed;top:calc(var(--safe-t) + 12px);left:50%;transform:translate(-50%,calc(-100% - var(--safe-t) - 40px));visibility:hidden;width:calc(100% - 32px);max-width:420px;background:var(--s3);border:1px solid var(--ac);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;z-index:61;transition:transform .45s cubic-bezier(.2,.9,.25,1.15);box-shadow:0 12px 36px rgba(0,0,0,.45)}
#logro.on{transform:translate(-50%,0);visibility:visible}
#logro .med{flex:0 0 40px;height:40px;border-radius:12px;background:var(--ac-soft);display:grid;place-items:center}
#logro .med svg,.lg .med svg{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#logro .e{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ac);font-weight:600}
#logro b{display:block;font-size:15px;margin-top:1px}
#logro small{color:var(--mu);font-size:12.5px}
.logros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg{display:flex;gap:10px;align-items:center;padding:10px 12px}
.lg .med{flex:0 0 34px;height:34px;border-radius:10px;background:var(--ac-soft);display:grid;place-items:center}
.lg b{display:block;font-size:13.5px;font-weight:600;line-height:1.2}
.lg small{font-size:11.5px;color:var(--mu);line-height:1.25;display:block;margin-top:2px}
.lg.no{opacity:.38}.lg.no .med{background:var(--s2)}.lg.no .med svg{stroke:var(--mu2)}
#toast{position:fixed;top:calc(var(--safe-t) + 12px);left:50%;transform:translate(-50%,calc(-100% - var(--safe-t) - 30px));visibility:hidden;background:var(--ac);color:var(--ac-ink);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:60;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 32px);text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (hover:hover){.item:hover{background:var(--s2)}}
</style>
</head>
<body>
<div id="app"></div>
<div id="descanso"><div class="t"><small>Descanso</small><span id="dt">1:30</span></div><button class="btn peq" id="dmas">+15 s</button><button class="btn peq" id="dfin">Saltar</button><div class="bar" id="dbar"></div></div>
<div id="velo"></div><div id="hoja"></div>
<div id="toast"></div>
<nav class="tabs"><div class="in">
  <button data-t="entreno"><svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>Entreno</button>
  <button data-t="progreso"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l4-5 4 3 6-8"/></svg>Progreso</button>
  <button data-t="rutina"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Rutina</button>
  <button data-t="mas"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Más</button>
</div></nav>
<canvas id="bicho" aria-hidden="true"></canvas><div id="bocadillo" role="status"></div><div id="logro" role="status"></div>

<script type="module">
// ===== El bicho: suelto por la pantalla, sin caja. Se sienta sobre la barra de abajo, se asoma por los lados,
// hace pesas mientras descansas y celebra las series y los récords. No tapa nada (no recibe toques).
import { crearMascota } from './bicho.js';
const cv = document.getElementById('bicho');
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- calendario por meses: toca un día entrenado y ves sus marcas ----------
let calMes = null;
function vCalendario() {
  const mes = calMes || hoy().slice(0, 7), [y, m] = mes.split('-').map(Number), primero = new Date(y, m - 1, 1), nDias = new Date(y, m, 0).getDate();
  const porFecha = new Map(); for (const r of D.regs) if (r.series.length && r.fecha.startsWith(mes)) { const x = porFecha.get(r.fecha) || { dia: r.dia, pr: false, n: 0 }; x.n += r.series.length; x.pr = x.pr || r.series.some((z) => z.pr); porFecha.set(r.fecha, x); }
  const hueco = (primero.getDay() + 6) % 7, h = hoy(), celdas = [];
  for (let i = 0; i < hueco; i++) celdas.push('<span></span>');
  for (let d = 1; d <= nDias; d++) { const fe = `${mes}-${pad(d)}`, x = porFecha.get(fe);
    celdas.push(x ? `<button class="cd si ${fe === h ? 'hoy' : ''}" data-cal="${fe}"><b>${d}</b><small>${esc(x.dia || '')}${x.pr ? ' ★' : ''}</small></button>` : `<span class="cd ${fe === h ? 'hoy' : ''}"><b>${d}</b></span>`); }
  const nombre = primero.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }), todos = fechasEntreno(), hayAntes = todos.length && todos[0].slice(0, 7) < mes, hayDespues = mes < hoy().slice(0, 7);
  return `<div class="card cal"><div class="cal-cab"><button id="calPrev" ${hayAntes ? '' : 'disabled'} aria-label="Mes anterior">‹</button><div><b>${esc(nombre.charAt(0).toUpperCase() + nombre.slice(1))}</b><small>${porFecha.size} entreno${porFecha.size === 1 ? '' : 's'}</small></div><button id="calNext" ${hayDespues ? '' : 'disabled'} aria-label="Mes siguiente">›</button></div>
    <div class="cal-sem">${['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((x) => `<span>${x}</span>`).join('')}</div><div class="cal-grid">${celdas.join('')}</div>
    <p class="texto" style="margin-top:8px;font-size:12px">Toca un día marcado para ver lo que levantaste. ★ = hiciste récord.</p></div>`;
}
const moverMes = (k) => { const [y, m] = (calMes || hoy().slice(0, 7)).split('-').map(Number), d = new Date(y, m - 1 + k, 1); calMes = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; pintar(); };
function aProgreso() {

  $('#avisos').onclick = async () => { if (!('Notification' in window)) { toast('En iPhone, añádela antes a la pantalla de inicio'); return; }
    const p = await Notification.requestPermission(); if (p === 'granted') { toast('Avisos activados'); notificar('Avisos activados', 'Así te aviso de tus logros.'); } else toast('Sin permiso para avisar'); pintar(); };
  $('#codOk').onclick = () => { const v = $('#codIn').value.trim(); const m = v.match(/cargar=([a-z0-9]+)/) || v.match(/^([a-z0-9]{6,20})$/); cargarCodigo(m ? m[1] : '', true); };
  $('#imp').onclick = () => $('#impf').click();
  $('#impf').onchange = async (e) => { const fl = e.target.files[0]; if (!fl) return; try { const o = JSON.parse(await fl.text()); if (!o || !o.rutina || !Array.isArray(o.regs)) throw 0; if (!confirm('Esto cambia todo lo de ahora por la copia. ¿Seguro?')) return; D = { ...nuevo(), ...o }; if (!o.logros) revisarLogros(true); guardar(); toast(`Copia recuperada: ${fechasEntreno().length} entrenos`); pintar(); } catch { toast('Ese archivo no es una copia de la app'); } };
  $('#reset').onclick = () => { if (!confirm('¿Borrar todos tus entrenos, pesos y la rutina?')) return; if (!confirm('Seguro seguro? No se puede deshacer.')) return; D = nuevo(); guardar(); pintar(); };
}

// ================= LOGROS =================
const ICONO = {
  trofeo: '<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>',
  rayo: '<svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/></svg>',
  fuego: '<svg viewBox="0 0 24 24"><path d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-6 6-6 10-1-1-2-2-2-4-1 2-1 4-1 6 0 4 3 7 7 7z"/></svg>',
  pesa: '<svg viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>',
  cal: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>',
  estrella: '<svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9L12 3z"/></svg>',
  bascula: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="4"/><path d="M8 9a5 5 0 0 1 8 0M12 9l1.5-2"/></svg>',
};
const LOGROS = [
  { id: 'primer', t: 'Primer día', d: 'Apunta tu primer entreno', i: 'pesa', ok: (s) => s.entrenos >= 1 },
  { id: 'e10', t: '10 entrenos', d: 'Ya es costumbre', i: 'cal', ok: (s) => s.entrenos >= 10 },
  { id: 'e25', t: '25 entrenos', d: 'Constancia de verdad', i: 'cal', ok: (s) => s.entrenos >= 25 },
  { id: 'e50', t: '50 entrenos', d: 'Medio centenar', i: 'trofeo', ok: (s) => s.entrenos >= 50 },
  { id: 'e100', t: '100 entrenos', d: 'Nivel bestia', i: 'trofeo', ok: (s) => s.entrenos >= 100 },
  { id: 'semana', t: 'Semana redonda', d: 'Cumple tu objetivo semanal', i: 'cal', ok: (s) => s.semMax >= s.obj },
  { id: 'racha3', t: 'Tres semanas seguidas', d: 'Cumple el objetivo 3 semanas', i: 'fuego', ok: (s) => s.racha >= 3 },
  { id: 'racha8', t: 'Dos meses on fire', d: 'Cumple el objetivo 8 semanas', i: 'fuego', ok: (s) => s.racha >= 8 },
  { id: 'pr1', t: 'Primer récord', d: 'Bate una marca tuya', i: 'estrella', ok: (s) => s.prs >= 1 },
  { id: 'pr10', t: '10 récords', d: 'Subiendo sin parar', i: 'estrella', ok: (s) => s.prs >= 10 },
  { id: 'pr50', t: '50 récords', d: 'Esto ya es otra cosa', i: 'estrella', ok: (s) => s.prs >= 50 },
  { id: 's100', t: 'Cien series', d: 'Apunta 100 series', i: 'rayo', ok: (s) => s.series >= 100 },
  { id: 's500', t: 'Quinientas series', d: 'Apunta 500 series', i: 'rayo', ok: (s) => s.series >= 500 },
  { id: 'club100', t: 'Club de los 100', d: '1RM estimado de 100 kg', i: 'trofeo', ok: (s) => s.maxE1 >= 100 },
  { id: 'peso', t: 'A la báscula', d: 'Apunta tu peso corporal', i: 'bascula', ok: (s) => s.pesos >= 1 },
];
function statsLogros() {
  const fechas = fechasEntreno(), obj = D.rutina.objetivo || 4, porSem = new Map(), porDia = new Map();
  for (const x of fechas) porSem.set(lunes(x), (porSem.get(lunes(x)) || 0) + 1);
  let racha = 0, mejorR = 0, prev = null;
  for (const [l, n] of [...porSem].sort()) {
    const seguida = prev && Math.round((new Date(l + 'T12:00') - new Date(prev + 'T12:00')) / 864e5) === 7;
    racha = n >= obj ? (seguida ? racha + 1 : 1) : 0; mejorR = Math.max(mejorR, racha); prev = l;
  }
  let prs = 0, series = 0, maxE1 = 0;
  for (const r of D.regs) for (const x of r.series) { if (x.pr) prs++; series++; maxE1 = Math.max(maxE1, e1rm(x.kg, x.reps)); }
  return { entrenos: fechas.length, obj, semMax: Math.max(0, ...porSem.values()), racha: mejorR, prs, series, maxE1, pesos: D.peso.length };
}
const colaLogros = [];
function revisarLogros(silencio = false) {
  const s = statsLogros(); D.logros = D.logros || {}; const nuevos = LOGROS.filter((l) => !D.logros[l.id] && l.ok(s));
  if (!nuevos.length) { if (silencio) guardar(); return; }
  nuevos.forEach((l) => D.logros[l.id] = hoy()); guardar(); if (silencio) return;
  const vacia = !colaLogros.length; colaLogros.push(...nuevos); if (vacia) mostrarLogro();
}
function mostrarLogro() {
  const l = colaLogros[0]; if (!l) return; const el = $('#logro');
  el.innerHTML = `<div class="med">${ICONO[l.i]}</div><div><div class="e">Logro conseguido</div><b>${esc(l.t)}</b><small>${esc(l.d)}</small></div>`;
  el.classList.add('on'); vibrar([30, 50, 30, 50, 60]); avisarBicho('logro');
  setTimeout(() => window.bichoDecir && window.bichoDecir(`¡${l.t}! Eso hay que celebrarlo.`, 4), 900);
  notificar('Logro conseguido: ' + l.t, l.d);
  setTimeout(() => { el.classList.remove('on'); colaLogros.shift(); if (pestana === 'progreso') pintar(); setTimeout(mostrarLogro, 700); }, 4200);
}
$('#logro').onclick = () => $('#logro').classList.remove('on');

// ================= AVISOS (notificaciones del móvil) =================
async function notificar(titulo, cuerpo) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  try {
    const r = 'serviceWorker' in navigator ? await navigator.serviceWorker.getRegistration() : null;
    if (r) await r.showNotification(titulo, { body: cuerpo, icon: 'icono-192.png', badge: 'icono-192.png', tag: titulo });
    else new Notification(titulo, { body: cuerpo, icon: 'icono-192.png' });
  } catch {}
}

// ================= CONSEJOS DEL BICHO =================
function consejo() {
  const h = hoy(), fechas = fechasEntreno(), obj = D.rutina.objetivo || 4;
  if (!fechas.length) return 'Apunta tu primera serie y yo te llevo las cuentas.';
  const dia = diaPorId(diaDeHoy()), ult = fechas[fechas.length - 1];
  const sin = Math.round((new Date(h + 'T12:00') - new Date(ult + 'T12:00')) / 864e5);
  const top = [], gen = ['Descansa de 1:30 a 2 min en lo pesado. Las prisas no suman kilos.', 'Apunta también los días malos: cuentan igual.', 'Si la máquina está ocupada, cambia el orden. Lo importante es hacerlo.', 'Bebe agua entre series. Lo digo yo, que soy líquido.'];
  if (sin >= 4) top.push(`Llevas ${sin} días sin venir. Hoy toca ${dia ? dia.nombre.toLowerCase() : 'entrenar'}: a por ello.`);
  if (dia && !D.regs.some((r) => r.fecha === h)) {
    for (const e of dia.ejercicios) { const sg = sugerir(e, ultima(e.id)); if (sg && sg.subir) { top.push(`Hoy toca subir en ${e.nombre.toLowerCase()}: ${f(sg.kg)} kg. La última vez te sobró.`); break; } }
    for (const e of dia.ejercicios) { const rs = regsDe(e.id).slice(-3); if (rs.length === 3) { const k = rs.map((r) => Math.max(...r.series.map((x) => x.kg))); if (k[0] === k[1] && k[1] === k[2]) { top.push(`En ${e.nombre.toLowerCase()} llevas 3 sesiones con ${f(k[0])} kg. Hoy intenta sacar una rep más.`); break; } } }
  }
  const sem = semanaActual(), dSem = (new Date().getDay() + 6) % 7;
  if (sem < obj && dSem >= 3 && obj - sem <= 7 - dSem) top.push(`Te faltan ${obj - sem} entreno${obj - sem > 1 ? 's' : ''} para cumplir la semana. Se puede.`);
  if (sem >= obj) top.push('Semana cumplida. Lo que hagas ahora es de propina.');
  if (top.length && Math.random() < 0.8) return top[Math.floor(Math.random() * top.length)];
  return gen[Math.floor(Math.random() * gen.length)];
}
setTimeout(() => { if (pestana === 'entreno' && window.bichoDecir) window.bichoDecir(consejo(), 7); }, 3200);
// cada ~6 min, si sigues por aquí, el bicho te dice algo
setInterval(() => { if (!document.hidden && window.bichoDecir && !$('#hoja').classList.contains('on') && Math.random() < 0.6) window.bichoDecir(consejo(), 6); }, 360000);

// ================= ENLACE CON TUS DATOS (?cargar=código) =================
// Carga la copia d/<código>.json una sola vez. El enlace NO se limpia: así, al añadir la app a la pantalla
// de inicio del iPhone (que tiene su propia memoria, aparte de Safari), la app instalada también lo lee.
// Los datos se SUMAN: lo que ya hayas apuntado en días que no vienen en el archivo (p. ej. hoy) se queda.
async function cargarCodigo(cod, manual = false) {
  if (!cod || !/^[a-z0-9]{6,20}$/.test(cod)) { if (manual) toast('Ese enlace no vale'); return; }
  const limpiar = () => {};
  if (D.cargado === cod && !manual) return;
  try {
    const r = await fetch(`d/${cod}.json`, { cache: 'no-store' }); if (!r.ok) throw 0; const o = await r.json(); if (!o || !o.rutina || !Array.isArray(o.regs)) throw 0;
    const enArchivo = new Set(o.regs.map((x) => x.fecha)), propios = D.regs.filter((x) => !enArchivo.has(x.fecha));
    const regs = [...o.regs, ...propios].sort((a, b) => a.fecha.localeCompare(b.fecha));
    const sesiones = [...(o.sesiones || []), ...D.sesiones.filter((x) => !enArchivo.has(x.fecha))].sort((a, b) => a.fecha.localeCompare(b.fecha));
    const pesos = [...(o.peso || []), ...D.peso.filter((x) => !(o.peso || []).some((y) => y.fecha === x.fecha))].sort((a, b) => a.fecha.localeCompare(b.fecha));
    D = { ...nuevo(), ...D, rutina: o.rutina, regs, sesiones, peso: pesos, cargado: cod }; revisarLogros(true); guardar(); pintar();
    toast(`Cargados tus ${fechasEntreno().length} entrenos`); setTimeout(() => window.bichoDecir && window.bichoDecir('¡Ya tengo todo tu historial! Mira en Progreso cuánto has subido.', 7), 2500);
  } catch { limpiar(); toast('No he podido cargar los datos de este enlace'); }
}
cargarCodigo(new URLSearchParams(location.search).get('cargar'));
if (!D.logros) revisarLogros(true);
pintar();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
