<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#232220">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<title>Gym</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#232220; --s1:#2B2926; --s2:#232220; --s3:#35322D; --line:#44403A; --rule:#35322D;
  --tx:#EFE9DD; --mu:#9A9385; --mu2:#7F796C;
  --ac:#F0C24B; --ac-ink:#241E0C; --ac-soft:rgba(240,194,75,.14);
  --ok:#F0C24B; --bad:#E5775B; --barra:#1D1C1A;
  --r:4px; --mono:'IBM Plex Mono',ui-monospace,monospace; --cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); --nav:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%;overscroll-behavior:none;background:var(--bg);color:var(--tx);font-family:Barlow,system-ui,sans-serif;font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased}
body{min-height:100dvh;overscroll-behavior-y:none}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:35;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--tx)}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 14px calc(var(--safe-b) + 150px)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:14px;padding:0 4px}
.eyebrow{font:400 11px var(--mono);color:var(--mu);letter-spacing:.14em;text-transform:uppercase}
h1{font:700 52px/.95 var(--cond);letter-spacing:.01em;text-transform:uppercase;margin-top:6px}
h1 b{color:var(--ac);font-weight:700}
h2{font:400 11px var(--mono);color:var(--mu);letter-spacing:.14em;text-transform:uppercase;margin:26px 4px 10px;display:flex;align-items:center;gap:10px}
h2::after{content:'';flex:1;height:1px;background:var(--line)}
h3{font:600 21px/1.1 var(--cond);letter-spacing:.03em;text-transform:uppercase}
.marc{text-align:right;flex:0 0 auto}
.marc small{display:block;font:400 11px var(--mono);letter-spacing:.14em;color:var(--mu);text-transform:uppercase}
.marc div{font:700 52px/.95 var(--cond);margin-top:6px}
.marc div i{color:var(--mu);font-style:normal}

/* pestañas de día (como solapas de libreta) */
.dias{position:relative;display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:0 -14px 14px;padding:0 14px;border-bottom:1px solid var(--line)}
.dias::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:8px 11px 9px;border-radius:3px 3px 0 0;background:none;border:0;color:var(--mu);font:500 12px var(--mono);letter-spacing:.04em;transition:background .15s,color .15s}
.chip b{font-family:var(--mono);font-weight:600;color:var(--tx);margin-right:6px}
.chip.on{background:var(--ac);color:var(--ac-ink)}
.chip.on b{color:var(--ac-ink)}
.chip:active{opacity:.8}

.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stack>*+*{margin-top:12px}

/* ejercicio = hoja de libreta */
.card.ej{padding:0 0 2px}
.card.ej.toca{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.ahora{display:inline-block;font:600 10px var(--mono);letter-spacing:.12em;color:var(--ac-ink);background:var(--ac);padding:2px 6px 1px;border-radius:2px;margin-bottom:5px}
.pasos{display:grid;gap:8px;margin:6px 0 2px;counter-reset:p}
.pasos div{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:start;font-size:14px;color:var(--tx)}
.pasos div::before{counter-increment:p;content:counter(p);font:600 12px var(--mono);color:var(--ac-ink);background:var(--ac);border-radius:2px;text-align:center;line-height:20px;height:20px}
.ej-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:9px 14px 8px;border-bottom:1px solid var(--line)}
.meta{font:400 11px var(--mono);color:var(--mu);margin-top:3px}
.cuenta{font:400 11px var(--mono);color:var(--mu);white-space:nowrap}
.cuenta.hecho{color:var(--ac)}
.info{display:flex;flex-wrap:wrap;gap:4px 14px;padding:9px 14px 9px;font:400 11.5px var(--mono);color:var(--mu);border-bottom:1px solid var(--rule)}
.info .k{color:var(--mu2)}
.info .num{color:var(--tx)}
.info .sug{color:var(--ac)}
.nota{font-size:13px;color:var(--mu);padding:8px 14px 0;font-style:italic}
.series{margin-top:0;display:block}
.fila{display:grid;grid-template-columns:24px 66px 1fr 1fr 34px;gap:0;align-items:center;height:42px;padding:0 12px 0 14px;position:relative;border-bottom:1px solid var(--rule)}
.fila:last-child{border-bottom:0}
.fila .n{font:500 12px var(--mono);color:var(--mu)}
.fila .p{font:400 11.5px var(--mono);color:var(--mu2);white-space:nowrap}
.campo{position:relative}
.campo input{width:100%;height:40px;border-radius:2px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0 32px 0 4px;font:700 29px var(--cond);text-align:right;color:var(--tx);outline:none;transition:background .15s,border-color .15s}
.campo input:focus{background:var(--ac-soft);border-bottom-color:var(--ac)}
.campo input::placeholder{color:var(--mu);opacity:1}
.campo input:not([data-c]){height:44px;border:1px solid var(--line);border-radius:3px;background:var(--s2);padding:0 34px 0 12px;font:500 16px var(--mono);text-align:left}
.campo input:not([data-c]):focus{border-color:var(--ac);background:var(--s2)}
.campo input[data-c=kg]{padding-right:26px}
.campo input[data-c=reps]{padding-right:37px}
.campo span{position:absolute;right:6px;bottom:9px;font:400 11px var(--mono);color:var(--mu);pointer-events:none}
.fila .ok{width:28px;height:28px;margin-left:auto;border-radius:50%;border:1.5px solid var(--line);background:none;display:grid;place-items:center;transition:background .15s,transform .1s}
.ok svg{width:15px;height:15px;stroke:transparent;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ok:active{transform:scale(.92)}
.fila.hecha .campo input{color:var(--tx)}
.fila.hecha .ok{background:var(--ac);border-color:var(--ac)}
.fila.hecha .ok svg{stroke:var(--ac-ink)}
.fila.pr .n{color:var(--ac)}
.fila.pr .p{visibility:hidden}
.fila.pr::after{content:'RÉCORD';position:absolute;left:36px;top:12px;transform:rotate(-6deg);border:1.5px solid var(--ac);color:var(--ac);font:500 10px var(--mono);letter-spacing:.18em;padding:2px 6px 1px;border-radius:2px;background:var(--s1);pointer-events:none}
.fila.drop .n{color:var(--ac);font-size:15px}
.acciones{display:flex;gap:16px;padding:8px 14px 8px;font:400 11px var(--mono);color:var(--mu);border-top:1px solid var(--rule);flex-wrap:wrap}
.acciones button{padding:4px 0}
.acciones button:active{color:var(--tx)}
.ej.saltado{opacity:.45}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border-radius:var(--r);font:600 18px var(--cond);letter-spacing:.06em;text-transform:uppercase;background:var(--s1);border:1px solid var(--line);transition:transform .1s,opacity .15s}
.btn:active{transform:scale(.985)}
.btn.pri{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.btn.peq{height:40px;font-size:16px;width:auto;padding:0 14px}
.btn.peligro{color:var(--bad)}
.fila-btn{display:flex;gap:8px}

/* barra de sesión */
.guardado{display:flex;gap:12px;align-items:center;margin-bottom:14px;border-color:var(--ac)}
.guardado .ok-g{flex:0 0 36px;height:36px;border-radius:50%;background:var(--ac);display:grid;place-items:center}
.guardado .ok-g svg{width:20px;height:20px;stroke:var(--ac-ink);stroke-width:2.6;fill:none}
.guardado b{display:block;font:600 19px var(--cond);letter-spacing:.03em;text-transform:uppercase}.guardado small{color:var(--mu);font-size:13px}
.hecho-g{width:64px;height:64px;border-radius:50%;background:var(--ac);display:grid;place-items:center;margin:6px auto 14px;animation:pop .45s cubic-bezier(.2,.9,.3,1.4)}
.hecho-g svg{width:34px;height:34px;stroke:var(--ac-ink);stroke-width:2.6;fill:none}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.sesion{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding:8px 14px}
.sesion .t{font:700 30px/1 var(--cond);color:var(--ac);letter-spacing:.02em}
.punto{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ac);margin-right:8px;animation:lat 1.6s ease-in-out infinite}
@keyframes lat{50%{opacity:.3}}

/* descanso: franja inferior con el tiempo grande */
#descanso{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + var(--nav));transform:translateY(100%);opacity:0;pointer-events:none;background:var(--barra);border-top:1px solid var(--line);height:64px;padding:0 14px 0 18px;display:flex;align-items:center;gap:8px;transition:transform .25s cubic-bezier(.2,.8,.2,1),opacity .2s;z-index:20}
#descanso.on{transform:none;opacity:1;pointer-events:auto}
#descanso .t{font:700 50px/1 var(--cond);color:var(--ac);letter-spacing:.02em;flex:1;display:flex;align-items:center;gap:14px;min-width:0}
#descanso .t small{font:400 11px var(--mono);color:var(--mu);letter-spacing:.14em;text-transform:uppercase;width:64px}
#descanso .btn.peq{height:34px;font-size:14px;padding:0 10px;background:none}
#descanso .bar{position:absolute;left:0;top:-1px;height:2px;background:var(--ac);transition:width 1s linear}
#descanso.fin{background:var(--ac)}
#descanso.fin .t{color:var(--ac-ink);font-size:26px}
#descanso.fin small{color:var(--ac-ink)}
#descanso.fin .btn{color:var(--ac-ink);border-color:rgba(36,30,12,.4)}

/* pestañas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--barra);border-top:1px solid var(--line);height:calc(var(--nav) + var(--safe-b));padding:6px 8px var(--safe-b);display:flex;justify-content:center;z-index:30}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:500 11px Barlow;color:var(--mu)}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--tx)}
nav.tabs button.on svg{stroke:var(--ac)}

/* progreso */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{padding:10px 12px}
.kpi .v{font:700 34px/1 var(--cond);letter-spacing:.01em}
.kpi .v small{font:400 12px var(--mono);color:var(--mu)}
.kpi .l{font:400 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin-top:4px}
.lista{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--rule)}
.item:active{background:var(--s3)}
.item .c{flex:1;min-width:0}
.item .c b{font:600 18px/1.15 var(--cond);letter-spacing:.03em;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .c small{color:var(--mu);font:400 11px var(--mono)}
.item .d{text-align:right;font:700 24px/1 var(--cond)}
.item .d small{display:block;font:400 10px var(--mono);color:var(--mu);margin-top:2px}
.spark{width:64px;height:26px;flex:0 0 auto}
.vacio{color:var(--mu);font-size:14px;padding:22px 14px;text-align:center}
.heroe{background:none;border:0;padding:0 4px}
.heroe .big{display:flex;align-items:flex-end;gap:12px;margin-top:4px}
.heroe .grande-p{font:700 96px/.82 var(--cond);color:var(--ac);letter-spacing:-.01em;margin:0}
.heroe .big span{font:600 22px/1.05 var(--cond);text-transform:uppercase;letter-spacing:.03em;padding-bottom:4px}
.heroe>.texto{margin-top:10px}
.graf{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:6px 4px 0;margin-top:12px}
.graf .grafico{margin:0;height:160px}
.musculos{display:grid;gap:0}
.mus{display:grid;grid-template-columns:78px 1fr 62px;grid-template-rows:auto auto;column-gap:10px;align-items:center;text-align:left;padding:5px 0 4px;border-bottom:1px solid var(--rule)}
.mus:last-child{border-bottom:0}
.mus:active{background:var(--s3)}
.mus .n{font:600 18px var(--cond);text-transform:uppercase;letter-spacing:.04em}
.mus .barra-m{height:10px;background:var(--rule);position:relative;overflow:hidden}
.mus .barra-m i{display:block;height:100%;background:var(--tx);opacity:.55}
.mus .v{text-align:right;font:700 22px var(--cond)}
.mus:first-child .barra-m i{background:var(--ac);opacity:1}
.mus:first-child .v{color:var(--ac)}
.mus small{grid-column:2/4;color:var(--mu);font:400 10.5px var(--mono);margin-top:2px}
.cal-cab{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-cab div{text-align:center}.cal-cab b{display:block;font:700 22px/1 var(--cond);letter-spacing:.04em;text-transform:uppercase}.cal-cab small{color:var(--mu);font:400 11px var(--mono);letter-spacing:.1em;text-transform:uppercase}
.cal-cab button{width:40px;height:40px;border-radius:3px;background:var(--s2);border:1px solid var(--line);font-size:22px;line-height:1;color:var(--tx)}
.cal-cab button:disabled{opacity:.3}
.cal-sem,.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-sem span{text-align:center;font:400 10px var(--mono);color:var(--mu);padding-bottom:4px}
.cd{aspect-ratio:1;border:1px solid var(--rule);border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:500 14px var(--cond);color:var(--mu)}
.cd b{font-weight:500;font-family:var(--cond);font-size:15px}
.cd.si{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.cd.si b{color:var(--ac-ink);font-weight:700}
.cd.si small{font:500 8.5px var(--mono);color:var(--ac-ink);white-space:nowrap}
.cd.si:active{transform:scale(.94)}
.cd.hoy{outline:1.5px solid var(--tx);outline-offset:1px}
.semanas{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:10px}
.semanas div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.semanas i{display:block;width:100%;border-radius:0;background:var(--rule);min-height:4px}
.semanas i.ok{background:var(--ac)}
.semanas span{font:400 10px var(--mono);color:var(--mu2)}

/* hoja */
#velo{position:fixed;inset:0;background:rgba(20,19,17,.6);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
#velo.on{opacity:1;pointer-events:auto}
#hoja{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:100%;max-width:560px;max-height:88dvh;overflow-y:auto;background:var(--bg);border:1px solid var(--line);border-bottom:0;border-top:2px solid var(--ac);border-radius:6px 6px 0 0;padding:10px 16px calc(var(--safe-b) + 24px);z-index:41;transition:transform .32s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
#hoja.on{transform:translate(-50%,0)}
#hoja .asa{width:38px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
#hoja h1{font-size:40px}
.grafico{width:100%;height:150px;display:block;margin:6px 0 4px}
.tabla{width:100%;border-collapse:collapse;font-size:13.5px}
.tabla td{padding:8px 0;border-top:1px solid var(--rule)}
.tabla td:last-child{text-align:right;font:500 13px var(--mono)}

/* rutina */
.edit-dia{padding:0;overflow:hidden}
.edit-dia .cab{display:flex;gap:8px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}
.edit-dia .cab .id{font:600 15px var(--mono);color:var(--ac);width:44px;background:transparent;border:0;outline:0}
.edit-dia .cab .nom{flex:1;background:transparent;border:0;outline:0;font:600 22px var(--cond);letter-spacing:.03em;text-transform:uppercase;min-width:0}
.ex{display:grid;grid-template-columns:1fr 44px 68px 26px;gap:6px;padding:7px 8px 7px 14px;align-items:center}
.ex+.ex{border-top:1px solid var(--rule)}
.ex input{background:var(--s2);border:1px solid transparent;border-radius:3px;height:36px;padding:0 6px;outline:none;min-width:0;width:100%;font-size:15px}
.ex input:focus{border-color:var(--ac)}
.ex input.c{text-align:center;font:500 14px var(--mono)}
.x{color:var(--mu2);font-size:20px;line-height:1;height:36px}
.x:active{color:var(--bad)}
.ex-cab{display:grid;grid-template-columns:1fr 44px 68px 26px;gap:6px;padding:8px 8px 2px 14px;font:400 10px var(--mono);color:var(--mu2);text-transform:uppercase;letter-spacing:.12em}
.tgs{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.tg{font:400 11px var(--mono);padding:5px 9px;border-radius:3px;background:var(--s2);color:var(--mu);border:1px solid transparent}
.tg.on{background:var(--ac-soft);color:var(--ac);border-color:rgba(240,194,75,.4)}
.ex.con-ss{box-shadow:inset 3px 0 0 var(--ac)}
.ss-grupo{position:relative;border-left:3px solid var(--ac);padding-left:8px;display:grid;gap:12px}
.ss-tag{font:400 10.5px var(--mono);color:var(--ac);letter-spacing:.04em;padding:2px 2px 0}
.etq{display:inline-block;font:500 10px var(--mono);letter-spacing:.08em;color:var(--ac);border:1px solid var(--ac);padding:1px 5px;border-radius:2px;vertical-align:3px;margin-left:4px}
.seg{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;padding:7px 11px 8px;border:1px solid var(--line);border-radius:3px;font:500 12px var(--mono);color:var(--mu);background:none;letter-spacing:.03em}
.seg button small{display:block;font:400 10px var(--mono);opacity:.75;margin-top:1px}
.seg button.on{background:var(--ac);color:var(--ac-ink);border-color:var(--ac)}
.mus-sel{grid-column:1/-1;justify-self:start;height:28px;margin-top:-2px;border-radius:3px;border:1px solid var(--line);background:var(--s2);color:var(--mu);font:400 11.5px var(--mono);padding:0 6px;outline:none}
.mus-sel.otro{color:var(--bad);border-color:var(--bad)}
.etapa-dias{display:grid;gap:10px;margin-top:6px}
.etapa-dias b{font:600 16px var(--cond);letter-spacing:.03em;text-transform:uppercase}
.semana-ed{display:grid;gap:6px}
.semana-ed label{display:grid;grid-template-columns:44px 1fr;gap:8px;align-items:center}
.semana-ed span{font:500 11px var(--mono);color:var(--mu);text-transform:uppercase;letter-spacing:.1em}
.semana-ed select{height:40px;border-radius:3px;border:1px solid var(--line);background:var(--s2);padding:0 10px;font-size:15px;outline:none}
.añadir{width:100%;padding:12px;color:var(--ac);font:500 12px var(--mono);letter-spacing:.06em;border-top:1px solid var(--rule)}

/* herramientas */
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{font:400 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu);display:block;margin-bottom:4px}
.form input,.form select{width:100%;height:44px;border-radius:3px;border:1px solid var(--line);background:var(--s2);padding:0 12px;font-family:var(--mono);outline:none}
.form input:focus,.form select:focus{border-color:var(--ac)}
.res{margin-top:12px;font-size:14px}
.res .grande{font:700 44px/1 var(--cond);color:var(--ac);letter-spacing:.01em}
.discos{display:flex;align-items:center;gap:3px;margin-top:10px;height:70px}
.discos .barra{height:8px;width:40px;background:var(--mu2);border-radius:2px}
.disco{border-radius:3px;display:grid;place-items:center;font:600 10px var(--mono);color:var(--ac-ink)}
.texto{font-size:14px;color:var(--mu);line-height:1.5}
.texto b{color:var(--tx);font-weight:500}

#bicho{position:fixed;left:0;top:0;width:132px;height:132px;z-index:25;pointer-events:none;transform:translate(-200px,120vh);transition-property:transform;transition-timing-function:cubic-bezier(.3,.9,.3,1);will-change:transform}
#bocadillo{position:fixed;left:0;top:0;max-width:230px;background:var(--tx);color:var(--ac-ink);font-size:14px;line-height:1.35;font-weight:500;padding:9px 12px;border-radius:6px;z-index:26;pointer-events:none;opacity:0;transform:translateY(6px) scale(.96);transform-origin:bottom right;transition:opacity .2s,transform .25s cubic-bezier(.2,.8,.2,1)}
#bocadillo.on{opacity:1;transform:none}
#bocadillo::after{content:'';position:absolute;bottom:-5px;left:var(--cola,28px);width:12px;height:12px;background:var(--tx);transform:rotate(45deg);border-radius:2px}
#logro{position:fixed;top:calc(var(--safe-t) + 12px);left:50%;transform:translate(-50%,calc(-100% - var(--safe-t) - 40px));visibility:hidden;width:calc(100% - 28px);max-width:420px;background:var(--s1);border:1px solid var(--ac);border-radius:var(--r);padding:12px 14px;display:flex;gap:12px;align-items:center;z-index:61;transition:transform .45s cubic-bezier(.2,.9,.25,1.15);box-shadow:0 12px 36px rgba(0,0,0,.45)}
#logro.on{transform:translate(-50%,0);visibility:visible}
#logro .med{flex:0 0 40px;height:40px;border-radius:3px;background:var(--ac-soft);display:grid;place-items:center}
#logro .med svg,.lg .med svg{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#logro .e{font:500 10.5px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ac)}
#logro b{display:block;font:600 20px var(--cond);letter-spacing:.03em;text-transform:uppercase;margin-top:1px}
#logro small{color:var(--mu);font-size:13px}
.logros{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lg{display:flex;gap:10px;align-items:center;padding:10px 12px}
.lg .med{flex:0 0 34px;height:34px;border-radius:3px;background:var(--ac-soft);display:grid;place-items:center}
.lg b{display:block;font:600 16px/1.15 var(--cond);letter-spacing:.03em;text-transform:uppercase}
.lg small{font-size:12px;color:var(--mu);line-height:1.25;display:block;margin-top:2px}
.lg.no{opacity:.4}.lg.no .med{background:var(--s2)}.lg.no .med svg{stroke:var(--mu2)}
body.en-chat #app{padding-bottom:0}
body.en-chat #bicho,body.en-chat #bocadillo{display:none}
.chat-vista{display:flex;flex-direction:column;height:calc(100dvh - var(--safe-t) - 18px - var(--nav) - var(--safe-b))}
.chat-cab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding-top:4px}
#bichoGrande{width:min(62vw,240px);height:min(62vw,240px);display:block}
.chat-nom{font:700 28px var(--cond);letter-spacing:.04em;text-transform:uppercase;margin-top:-8px}
.chat-est{font:400 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mu);margin-top:2px}
.chat-est.rojo{color:var(--bad)}
.chat-lista{flex:1 1 auto;overflow-y:auto;padding:12px 2px 8px;display:flex;flex-direction:column;gap:8px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.msg{max-width:84%;display:flex;flex-direction:column}
.msg .txt{padding:9px 12px;border-radius:4px;font-size:15px;line-height:1.4;white-space:normal;word-wrap:break-word}
.msg small{font:400 10px var(--mono);color:var(--mu2);margin:3px 2px 0}
.msg.el{align-self:flex-start}.msg.el .txt{background:var(--s1);border:1px solid var(--line);border-left:2px solid var(--ac)}
.msg.yo{align-self:flex-end;align-items:flex-end}.msg.yo .txt{background:var(--ac);color:var(--ac-ink)}
.escribiendo .txt{display:flex;gap:4px;padding:12px 14px}
.escribiendo i{width:6px;height:6px;border-radius:50%;background:var(--mu);animation:punt 1s infinite}
.escribiendo i:nth-child(2){animation-delay:.15s}.escribiendo i:nth-child(3){animation-delay:.3s}
@keyframes punt{0%,80%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.chat-caja{flex:0 0 auto;display:flex;gap:8px;padding:8px 0 10px}
.chat-caja input{flex:1;height:46px;border-radius:4px;border:1px solid var(--line);background:var(--s1);padding:0 14px;outline:none}
.chat-caja input:focus{border-color:var(--ac)}
.chat-caja button{width:46px;height:46px;border-radius:4px;background:var(--ac);display:grid;place-items:center}
.chat-caja svg{width:22px;height:22px;stroke:var(--ac-ink);stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button{position:relative}
nav.tabs button.aviso::after{content:'';position:absolute;top:4px;left:calc(50% + 8px);width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--barra)}
#toast{position:fixed;top:calc(var(--safe-t) + 12px);left:50%;transform:translate(-50%,calc(-100% - var(--safe-t) - 30px));visibility:hidden;background:var(--ac);color:var(--ac-ink);padding:9px 16px;border-radius:3px;font:600 17px var(--cond);letter-spacing:.05em;text-transform:uppercase;z-index:60;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:calc(100% - 28px);text-align:center}
#toast.on{transform:translate(-50%,0);visibility:visible}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (hover:hover){.item:hover{background:var(--s3)}}

<script type="module">
// ===== El bicho: suelto por la pantalla, sin caja. Se sienta sobre la barra de abajo, se asoma por los lados,
// hace pesas mientras descansas y celebra las series y los récords. No tapa nada (no recibe toques).
import { crearMascota } from './bicho.js';
const cv = document.getElementById('bicho');
const quieto = matchMedia('(prefers-reduced-motion: reduce)').matches;
let m; try { m = crearMascota(cv, { transparente: true, sombra: false, vista: 0.92, espontaneas: false, ojos: '25' }); } catch (e) { cv.remove(); }
window.crearBicho = (c, op) => crearMascota(c, op);
if (m) {
  const T = (n) => { try { m.espontanea(n); } catch {} };
  const X = (n, s) => { try { m.expresion(n, s); } catch {} };
  const tam = () => cv.offsetWidth || 96;
  const suelo = () => { const nav = document.querySelector('nav.tabs').getBoundingClientRect().top; return nav - tam() * 0.74; };
  let lado = 'der', modo = 'fuera', ocupadoHasta = 0, tIdle, foco = false;
  const ir = (x, y, r = 0, dur = 0.9) => { cv.style.transitionDuration = quieto ? '0s' : dur + 's'; cv.style.transform = `translate(${x}px, ${y}px) rotate(${r}deg)`; };
  const xSuelo = (l) => l === 'izq' ? 6 : l === 'centro' ? innerWidth / 2 - tam() / 2 : innerWidth - tam() - 6;
  function sentarse(l = lado, dur) { lado = l; modo = 'suelo'; ir(xSuelo(l), suelo(), 0, dur); }
  function esconder(dur = 0.6) { modo = 'fuera'; ir(xSuelo(lado), innerHeight + 20, 0, dur); }
  const ocupado = () => Date.now() < ocupadoHasta;
  const ocupar = (s) => { ocupadoHasta = Date.now() + s * 1000; };
  // se asoma por un lado de la pantalla, a media altura, girado hacia dentro
  function asomarse() {
    const l = Math.random() < 0.5 ? 'izq' : 'der', s = tam(), y = innerHeight * (0.3 + Math.random() * 0.25);
    const fueraX = l === 'izq' ? -s : innerWidth, dentroX = l === 'izq' ? -s * 0.42 : innerWidth - s * 0.58, rot = l === 'izq' ? 90 : -90;
    ocupar(7.5); esconder(0.5);
    setTimeout(() => { ir(fueraX, y, rot, 0); }, 550);
    setTimeout(() => { ir(dentroX, y, rot, 0.7); X('wow', 1.2); }, 650);
    setTimeout(() => { ir(fueraX + (l === 'izq' ? s * 0.25 : -s * 0.25), y, rot, 0.25); }, 2600);
    setTimeout(() => { ir(dentroX, y, rot, 0.35); X('happy', 1.5); }, 3300);
    setTimeout(() => { ir(fueraX, y, rot, 0.5); }, 5200);
    setTimeout(() => { ir(xSuelo(l), innerHeight + 20, 0, 0); }, 5800);
    setTimeout(() => { if (!foco) sentarse(l, 0.8); }, 5900);
  }
  const espera = (ms) => new Promise((r) => setTimeout(r, ms));
  const libre = () => !document.hidden && !foco && !ocupado() && modo === 'suelo';
  // a otro sitio del suelo (izquierda, centro o derecha), caminando
  function pasear() { const L = ['izq', 'centro', 'der'].filter((x) => x !== lado); const l = L[Math.floor(Math.random() * L.length)]; ocupar(3); sentarse(l, l === 'centro' || lado === 'centro' ? 1.6 : 2.6); }
  // saltitos de verdad: sube y baja por la pantalla
  async function saltitos(n = 3, alto = 34) {
    if (modo !== 'suelo') return; ocupar(n * 0.5 + 0.5); X('happy', n * 0.5 + 0.6); const x = xSuelo(lado), y = suelo();
    for (let i = 0; i < n; i++) { ir(x, y - alto, 0, 0.2); await espera(210); ir(x, y, 0, 0.22); await espera(260); }
  }
  // se convierte en mancuerna y se «levanta» a sí mismo
  async function mancuerna() {
    if (modo !== 'suelo') return; ocupar(7); try { m.forma('pesa'); } catch { return; }
    const x = xSuelo(lado), y = suelo(); await espera(900);
    for (let i = 0; i < 3; i++) { ir(x, y - 46, 0, 0.55); await espera(650); ir(x, y - 6, 0, 0.45); await espera(520); }
    ir(x, y, 0, 0.3); await espera(400); X('happy', 1.5);
  }
  const NUEVAS = ['batido', 'flexiones', 'toalla', 'discos', 'calentar', 'comba', 'dominadas', 'selfie'].filter((n) => m.listaEspontaneas().includes(n));
  const GESTOS = ['pesa', 'mancuerna', 'mancuerna', 'saltitos', 'saltitos', 'feliz', 'estrella', 'malabares', 'baile', 'voltereta', 'bostezo', ...NUEVAS, ...NUEVAS];
  // las nuevas (batido, flexiones, toalla, discos, calentar) salen casi siempre y por turnos, para que se vean todas
  let colaNuevas = [];
  function hacerGesto() {
    let g;
    if (NUEVAS.length && Math.random() < 0.7) { if (!colaNuevas.length) colaNuevas = [...NUEVAS].sort(() => Math.random() - 0.5); g = colaNuevas.shift(); }
    else g = GESTOS[Math.floor(Math.random() * GESTOS.length)];
    if (g === 'saltitos') saltitos(2 + Math.floor(Math.random() * 3)); else if (g === 'mancuerna') mancuerna();
    else if (g === 'feliz') { T('sonrisa'); ocupar(4); } else { T(g); ocupar(6); }
  }
  // cada 9-16 s hace algo en el sitio; cada ~50-70 s se cambia de sitio (camina o se asoma por un lado)
  let proxMover = Date.now() + 45000;
  function siguiente() {
    clearTimeout(tIdle); tIdle = setTimeout(() => {
      if (libre()) {
        if (Date.now() > proxMover) { proxMover = Date.now() + 50000 + Math.random() * 20000; Math.random() < 0.4 ? asomarse() : pasear(); }
        else hacerGesto();
      }
      siguiente();
    }, 6000 + Math.random() * 4000);
  }
  // superar tu marca de verdad: fiesta
  async function fiesta(texto) {
    clearInterval(tPesas); ocupar(9); const antes = modo; modo = 'suelo'; lado = 'centro'; ir(xSuelo('centro'), suelo(), 0, 0.5); await espera(550);
    T('estrella'); await saltitos(4, 44); ocupar(8); if (texto && window.bichoDecir) window.bichoDecir(texto, 4);
    await espera(2600); T('corazon'); await espera(4300);
    if (antes === 'descanso' && document.getElementById('descanso').classList.contains('on')) aDescanso();
  }
  // descanso: se sube encima del temporizador y hace pesas
  let tPesas;
  function aDescanso() {
    const b = document.getElementById('descanso').getBoundingClientRect(); modo = 'descanso';
    ir(b.right - tam() - 4, b.top - tam() * 0.80, 0, 0.7); clearInterval(tPesas);
    // primero levanta la pesa; luego se hace reloj de arena y se va vaciando con el descanso que queda
    setTimeout(() => T('pesa'), 750);
    if (m.reloj) { let n = 0; tPesas = setInterval(() => { if (modo !== 'descanso') return; n++; if (n >= 7) { try { m.reloj(window.descansoFrac ? window.descansoFrac() : 0.5); } catch {} } }, 1000); }
    else tPesas = setInterval(() => { if (modo === 'descanso') T('pesa'); }, 7000);
  }
  function finDescanso(acabado) { clearInterval(tPesas); try { m.reloj && m.reloj(null); } catch {} if (modo !== 'descanso') return; sentarse(lado, 0.7); if (acabado) setTimeout(() => T('voltereta'), 750); }

  // bocadillo: el bicho dice algo (consejos, logros)
  const boc = document.getElementById('bocadillo'); let tBoc;
  window.bichoDecir = (texto, seg = 6) => {
    if (foco) return; const fuera = modo === 'fuera'; if (fuera) sentarse(lado, 0.6);
    setTimeout(() => {
      boc.textContent = texto; const r = cv.getBoundingClientRect(), bw = Math.min(230, innerWidth - 32); boc.style.maxWidth = bw + 'px';
      const w = boc.offsetWidth, h = boc.offsetHeight, cx = r.left + r.width / 2; let x = cx - w / 2; x = Math.max(12, Math.min(innerWidth - w - 12, x));
      boc.style.left = x + 'px'; boc.style.top = (r.top + r.height * 0.2 - h) + 'px'; boc.style.setProperty('--cola', Math.max(12, Math.min(w - 24, cx - x - 6)) + 'px');
      boc.classList.add('on'); X('happy', 1.2); clearTimeout(tBoc); tBoc = setTimeout(() => boc.classList.remove('on'), seg * 1000); ocupar(seg);
    }, fuera ? 800 : 0);
  };
  document.addEventListener('focusin', () => boc.classList.remove('on'));
  window.bicho = (ev, dato) => {
    if (foco && ev !== 'foco-fuera') return;
    switch (ev) {
      case 'serie': X('happy', 1.4); break;
      case 'pr-grande': fiesta(dato); break;
      case 'mancuerna': if (libre()) mancuerna(); break;
      case 'saltitos': if (libre()) saltitos(3); break;
      case 'pr': ocupar(4.5); if (modo === 'descanso') T('estrella'); else { ir(innerWidth / 2 - tam() / 2, suelo(), 0, 0.6); setTimeout(() => T('estrella'), 600); setTimeout(() => { if (modo === 'suelo') sentarse(lado, 0.8); }, 4400); } break;
      case 'descanso': aDescanso(); break;
      case 'descanso-fin': finDescanso(dato); break;
      case 'terminar': ocupar(9); clearInterval(tPesas); sentarse(lado, 0.6); setTimeout(() => T('baile'), 700); setTimeout(() => T('corazon'), 5600); break;
      case 'asomarse': if (!ocupado() && modo === 'suelo') asomarse(); break;
      case 'logro': ocupar(4); T('estrella'); break;
      case 'objetivo': (async () => { ocupar(5); X('happy', 2); if (modo === 'suelo') await saltitos(3, 40); if (dato && window.bichoDecir) window.bichoDecir(dato, 4.5); })(); break;
      case 'toalla': if (modo === 'suelo' && !ocupado() && NUEVAS.includes('toalla')) { T('toalla'); ocupar(5); } break;
      case 'calentar': if (NUEVAS.includes('calentar')) { setTimeout(() => { T('calentar'); ocupar(6); }, 4500); } break;
      case 'pestana': if (modo === 'suelo' && !ocupado() && Math.random() < 0.35) X('wow', 0.9); break;
    }
  };
  // enfado: rojo y con mala cara (si el bicho lo sabe hacer)
  window.bichoEnfado = (nivel) => { try { m.enfado ? m.enfado(nivel) : (nivel > 0.5 && X('strain', 3)); } catch {} };
  try { if (D.enfado && D.enfado.nivel > 0) window.bichoEnfado(D.enfado.nivel); } catch {}
  // tocarle: se pone contento (y si estaba enfadado, se le pasa)
  let tragarClick = false; document.addEventListener('click', (e) => { if (tragarClick) { e.preventDefault(); e.stopPropagation(); tragarClick = false; } }, { capture: true });
  document.addEventListener('pointerdown', (e) => {
    if (modo === 'fuera' || document.body.classList.contains('en-chat')) return;
    const r = cv.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * 0.52, rad = r.width * 0.3;
    if (Math.hypot(e.clientX - cx, e.clientY - cy) > rad || e.target.closest('input,select,textarea,nav,#descanso button,#hoja')) return;
    e.preventDefault(); e.stopPropagation(); tragarClick = true; setTimeout(() => { tragarClick = false; }, 600);
    const estaba = window.calmarBichoToque ? window.calmarBichoToque() : false;
    if (estaba === true) { X('happy', 2); window.bichoDecir && window.bichoDecir('Vale, vale… se me pasa. Pero la próxima vez no tardes tanto.', 4); return; }
    if (estaba === 'resp') { X('happy', 2); if (modo === 'suelo') saltitos(2, 30); window.bichoDecir && window.bichoDecir(['¡Así me gusta! A por la siguiente.', 'Eso es. Sigue así.', 'Bien. No me dejes tirado.'][Math.floor(Math.random() * 3)], 3.5); return; }
    if (ocupado() && modo !== 'suelo') { X('happy', 1.2); return; }
    const k = Math.random(); X('happy', 1.5);
    if (modo === 'suelo') { if (k < 0.45) saltitos(2, 30); else if (k < 0.65) T('corazon'); else if (k < 0.8) T('sonrisa'); }
    if (Math.random() < 0.35 && window.bichoDecir) window.bichoDecir(['¡Ey! Eso hace cosquillas.', 'Sí, sí, yo también te quiero. Ahora a entrenar.', '¿Qué? ¿Me echabas de menos?', 'No me toques tanto que me distraes.'][Math.floor(Math.random() * 4)], 3);
  }, { capture: true });
  // con el teclado abierto se esconde para no estorbar
  document.addEventListener('focusin', (e) => { if (e.target.matches('input,select,textarea')) { foco = true; clearInterval(tPesas); esconder(0.35); } });
  document.addEventListener('focusout', () => { setTimeout(() => { if (document.activeElement && document.activeElement.matches('input,select,textarea')) return; foco = false;
    if (document.getElementById('descanso').classList.contains('on')) aDescanso(); else sentarse(lado, 0.6); }, 250); });
  // si el campo donde escribías desaparece (p. ej. cambias de pestaña), el navegador no avisa: lo comprobamos nosotros
  setInterval(() => { if (foco && !(document.activeElement && document.activeElement.matches('input,select,textarea'))) { foco = false; if (document.getElementById('descanso').classList.contains('on')) aDescanso(); else sentarse(lado, 0.6); } }, 2000);
  addEventListener('resize', () => { if (modo === 'suelo') sentarse(lado, 0); else if (modo === 'descanso') aDescanso(); });
  // entrada: sube desde abajo, mira y saluda
  esconder(0); setTimeout(() => { sentarse('der', 0.9); setTimeout(() => X('wow', 1), 700); setTimeout(() => T('sonrisa'), 1500); }, 900);
  siguiente();
}

<script>
'use strict';

const dias = () => D.rutina.dias;
const diaPorId = (id) => dias().find((d) => d.id === id);
function diaDeHoy() {
  const h = hoy(), ids = new Set(dias().map((d) => d.id));
  if (D.hoyDia && D.hoyDia.fecha === h && ids.has(D.hoyDia.dia)) return D.hoyDia.dia;
  const orden = (D.rutina.orden || []).filter((x) => ids.has(x)); const o = orden.length ? orden : dias().map((d) => d.id);
  const cerrados = D.sesiones.filter((x) => x.fecha === h).map((x) => x.dia);
  const deHoy = D.regs.filter((r) => r.fecha === h && ids.has(r.dia) && r.series.length && !cerrados.includes(r.dia));
  if (deHoy.length) return deHoy[deHoy.length - 1].dia;
  const sem = semanaRut();
  if (sem) { const w = new Date(h + 'T12:00').getDay(); if (!cerrados.length && sem[w] && ids.has(sem[w])) return sem[w]; return proximoDiaSemana(cerrados.length ? 1 : 0)?.dia || o[0]; }
  if (cerrados.length) { const u = cerrados[cerrados.length - 1]; return o.includes(u) ? o[(o.indexOf(u) + 1) % o.length] : o[0]; }
  const prev = D.regs.filter((r) => r.fecha < h && o.includes(r.dia));
  if (prev.length) { const i = o.indexOf(prev[prev.length - 1].dia); return o[(i + 1) % o.length]; }
  return o[0];
}
// semana: array de 7 (0 = domingo) con el id del día o '' si es descanso
const semanaRut = () => { const s = D.rutina.semana; return Array.isArray(s) && s.length === 7 && s.some(Boolean) ? s : null; };
const NOM_SEM = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
function proximoDiaSemana(desde = 1) { const sem = semanaRut(); if (!sem) return null; const ids = new Set(dias().map((d) => d.id)); const b = new Date(hoy() + 'T12:00'); for (let k = desde; k <= 7; k++) { const d = new Date(b); d.setDate(d.getDate() + k); const x = sem[d.getDay()]; if (x && ids.has(x)) return { dia: x, k, w: d.getDay() }; } return null; }
const hoyDescanso = () => { const sem = semanaRut(), h = hoy(); if (!sem) return false; if (D.hoyDia && D.hoyDia.fecha === h) return false; if (D.regs.some((r) => r.fecha === h && r.series.length) || D.sesiones.some((x) => x.fecha === h)) return false; return !sem[new Date(h + 'T12:00').getDay()]; };
const regsDe = (ej) => D.regs.filter((r) => r.ej === ej && r.series.length);
const ultima = (ej) => { const h = hoy(), d = diaDeHoy(); const p = regsDe(ej).filter((r) => r.fecha < h || (r.fecha === h && r.dia !== d)); return p.length ? p[p.length - 1] : null; };
const regHoy = (ej) => { const h = hoy(), d = diaDeHoy(); return D.regs.find((r) => r.ej === ej && r.fecha === h && r.dia === d); };
// Lo que toca hoy, a partir de tu serie más pesada de la última vez:
//  · si llegaste al tope de reps del rango -> SUBE el peso (~5 %, a saltos de 2,5 kg; +1 kg si es mancuerna ligera)
//    y las reps salen de tu 1RM estimado + 2 % (para que sea un poco más que la última vez);
//  · si no llegaste -> mismo peso y +2 reps (sin pasar del tope).
const subirPeso = (kg) => Math.round((kg < 10 ? kg + 1 : Math.max(kg + 2.5, Math.ceil(kg * 1.05 / 2.5) * 2.5)) * 100) / 100;
function sugerir(e, u) {
  if (!u || !u.series.length) return null;
  const n = repsNums(e.reps), top = n.length ? Math.max(...n) : null, bajo = n.length ? Math.min(...n) : null;
  const lista = u.series.filter((x) => !x.drop).length ? u.series.filter((x) => !x.drop) : u.series;
  const fuerza = (x) => (x.kg > 0 ? e1rm(x.kg, x.reps) : x.reps * 0.001); // tu mejor serie de la última vez (más fuerza)
  const best = lista.reduce((a, x) => (fuerza(x) > fuerza(a) ? x : a));
  if (best.kg <= 0) return { kg: 0, reps: best.reps + 2, subir: false };
  if (top != null && best.reps >= top) {
    const kg2 = subirPeso(best.kg), meta = e1rm(best.kg, best.reps) * 1.02;
    const r = Math.max(bajo ?? 1, Math.min(top, Math.floor(30 * (meta / kg2 - 1))));
    return { kg: kg2, reps: r, subir: true };
  }
  return { kg: best.kg, reps: top != null ? Math.min(top, best.reps + 2) : best.reps + 2, subir: false };
}
// RÉCORD (como se entiende en el gym): más kilos que nunca en ese ejercicio,
// o más repeticiones que nunca con ese peso o con más. La primera vez que haces un ejercicio no cuenta.
function esRecord(prev, kg, reps) {
  if (!prev.length) return false;
  const maxKg = Math.max(...prev.map((x) => x.kg));
  if (kg > maxKg) return true;
  const conMas = prev.filter((x) => x.kg >= kg); return conMas.length ? reps > Math.max(...conMas.map((x) => x.reps)) : false;
}
// vuelve a marcar todos los récords del historial con la regla de arriba
function recalcularRecords() {
  const visto = new Map();
  // cada serie se compara con lo que hiciste en DÍAS ANTERIORES (el primer día de un ejercicio nunca es récord)
  for (const r of [...D.regs].sort((a, b) => a.fecha.localeCompare(b.fecha))) {
    const prev = (visto.get(r.ej) || []).filter((y) => y.fecha < r.fecha);
    for (const x of r.series) { if (esRecord(prev, x.kg, x.reps)) x.pr = true; else delete x.pr; }
    visto.set(r.ej, [...(visto.get(r.ej) || []), ...r.series.map((x) => ({ kg: x.kg, reps: x.reps, fecha: r.fecha }))]);
  }
  for (const ss of D.sesiones) { const rs = D.regs.filter((r) => r.fecha === ss.fecha); ss.prs = [...new Set(rs.filter((r) => r.series.some((x) => x.pr)).map((r) => r.nombre))]; }
}
// Mejor marca de un ejercicio (sin contar la serie i de hoy, para detectar récords)
function mejor(ej, excluir) {
  let m = { e1: 0, kg: 0, reps: 0, fecha: null };
  for (const r of regsDe(ej)) r.series.forEach((s, i) => { if (excluir && r === excluir.reg && i === excluir.i) return; const v = s.kg > 0 ? e1rm(s.kg, s.reps) : s.reps * 0.001; if (v > m.e1) m = { e1: v, kg: s.kg, reps: s.reps, fecha: r.fecha }; });
  return m;
}

  if (fecha) { const c = {}; D.regs.filter((r) => r.fecha === fecha).forEach((r) => { const g = grupoDe(r.ej, r.nombre); if (g !== 'otro') c[g] = (c[g] || 0) + r.series.length; }); const top = Object.entries(c).sort((a, b) => b[1] - a[1]).slice(0, 2).map(([g]) => nombreGrupo(g).toLowerCase()); if (top.length) return (top.join(' y ')).replace(/^./, (x) => x.toUpperCase()); }

  const top = [], gen = ['Descansa tus 3 minutos en lo pesado. Las prisas no suman kilos.', 'Apunta también los días malos: cuentan igual.', 'Si la máquina está ocupada, cambia el orden. Lo importante es hacerlo.', 'Bebe agua entre series. Lo digo yo, que soy líquido.'];

    const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
    return { hojas: wb.SheetNames.map((n) => XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: false, defval: '' })) };
  }
  if (/\.json$/.test(nom)) return { json: JSON.parse(await file.text()) };
  return { texto: await file.text() };
}
async function impAnalizar(texto, file, ultFecha) {
  let res = null;
  if (file) {
    const a = await impLeerArchivo(file);
    if (a.json) { const o = a.json; if (o.rutina && Array.isArray(o.regs)) return { rutina: o.rutina, regs: o.regs, sesiones: o.sesiones || [], raros: [], copia: true }; throw new Error('Ese JSON no es una copia de la app'); }
    if (a.hojas) {
      for (const h of a.hojas) { const r = impDesdeTabla(h, ultFecha); if (r && (!res || r.regs.length > res.regs.length)) res = r; }
      if (!res) texto = a.hojas.map((h) => h.map((f) => f.filter((v) => v !== '').join(' ')).join('\n')).join('\n');
    } else texto = a.texto;
  }
  if (!res) res = impDesdeNotas(texto || '');
  const m = impMontar(res); if (!m) return null; m.raros = res.raros || []; return m;
}
function hojaImportar() {
  abrirHoja(`<div class="eyebrow">Importar</div><h1 style="margin-bottom:6px">Tu entrenamiento</h1>
   <p class="texto" style="margin-bottom:12px">Pega tus notas del gym o sube tu Excel. Lo analizo aquí mismo y te enseño lo que he entendido antes de cargar nada. Ejemplo de notas:<br><span class="num" style="color:var(--tx)">7 sep<br>Press banca<br>60(10)<br>60(8-7)<br>50(12)+40(10)</span></p>
   <textarea id="impTxt" rows="7" placeholder="Pega aquí tus notas…" style="width:100%;border-radius:12px;border:1px solid var(--line);background:var(--s2);padding:10px 12px;outline:none;resize:vertical;font-size:14px"></textarea>
   <div class="fila-btn" style="margin-top:8px"><button class="btn" id="impArch">Subir Excel o archivo</button><input type="file" id="impFile" accept=".xlsx,.xls,.ods,.csv,.txt,.json,text/plain" hidden></div>
   <p class="texto" id="impArchNom" style="margin-top:6px"></p>
   <div class="form" style="margin-top:8px;grid-template-columns:1fr"><div><label>Si tu archivo va por semanas y sin fechas: día del último entreno</label><input type="date" id="impFecha" value="${hoy()}"></div></div>
   <button class="btn pri" id="impGo" style="margin-top:12px">Analizar</button>
   <div id="impRes" style="margin-top:14px"></div>`);
  let file = null;
  $('#impArch').onclick = () => $('#impFile').click();
  $('#impFile').onchange = (e) => { file = e.target.files[0] || null; $('#impArchNom').textContent = file ? `Archivo: ${file.name}` : ''; };
  $('#impGo').onclick = async () => {
    const out = $('#impRes'); out.innerHTML = '<p class="texto">Analizando…</p>';
    try {
      const m = await impAnalizar($('#impTxt').value, file, $('#impFecha').value || hoy());
      if (!m || !m.regs.length) { out.innerHTML = '<p class="texto">No he encontrado entrenos. Mira que cada día empiece por la fecha («7 sep») y que las series vayan como «kilos(reps)».</p>'; return; }
      const fs = [...new Set(m.regs.map((r) => r.fecha))], nser = m.regs.reduce((a, r) => a + r.series.length, 0), nej = new Set(m.regs.map((r) => r.ej)).size;
      out.innerHTML = `<div class="card stack"><b>He encontrado ${fs.length} entrenos</b><p class="texto">Del ${fCorta(fs[0])} al ${fCorta(fs[fs.length - 1])} · ${nser} series · ${nej} ejercicios.</p>
        <p class="texto"><b>Tu rutina:</b><br>${m.rutina.dias.map((d) => `${esc(d.nombre)}: ${d.ejercicios.map((e) => esc(e.nombre)).join(', ')}`).join('<br>')}</p>
        ${m.raros.length ? `<p class="texto">No he sabido leer ${m.raros.length} línea${m.raros.length > 1 ? 's' : ''}: <span class="num">${m.raros.slice(0, 4).map(esc).join(' · ')}</span></p>` : ''}
        <p class="texto">${D.regs.length ? 'Lo que ya tienes apuntado en otros días se queda; la rutina se cambia por esta.' : ''}</p>
        <button class="btn pri" id="impOk">Cargar mis entrenos</button></div>`;
      $('#impOk').onclick = () => {
        const en = new Set(m.regs.map((x) => x.fecha)), propios = D.regs.filter((x) => !en.has(x.fecha));
        D = { ...nuevo(), ...D, rutina: m.rutina, regs: [...m.regs, ...propios].sort((a, b) => a.fecha.localeCompare(b.fecha)), sesiones: [...m.sesiones, ...D.sesiones.filter((x) => !en.has(x.fecha))].sort((a, b) => a.fecha.localeCompare(b.fecha)), hoyDia: null, etapas: [], etapasV: 0, rutinaDesde: null };
        asegurarEtapas(true); if (D.etapas.length) toast(`He visto ${D.etapas.length + 1} rutinas distintas: las tienes en Rutina y en Progreso`);
        revisarLogros(true); guardar(); cerrarHoja(); pestana = 'progreso'; pintar(); window.scrollTo(0, 0);
        toast(`Cargados ${fs.length} entrenos`); setTimeout(() => window.bichoDecir && window.bichoDecir('¡Ya tengo todo tu historial! Mira cuánto has subido.', 6), 1500);
      };
    } catch (err) { out.innerHTML = `<p class="texto">${esc(err.message || 'No he podido leerlo')}</p>`; }
  };
}

// ================= ENLACE CON TUS DATOS (?cargar=código) =================
// Carga la copia d/<código>.json una sola vez. El enlace NO se limpia: así, al añadir la app a la pantalla
// de inicio del iPhone (que tiene su propia memoria, aparte de Safari), la app instalada también lo lee.
// Los datos se SUMAN: lo que ya hayas apuntado en días que no vienen en el archivo (p. ej. hoy) se queda.
async function cargarCodigo(cod, manual = false) {
  if (!cod || !/^[a-z0-9]{6,20}$/.test(cod)) { if (manual) toast('Ese enlace no vale'); return; }
  const limpiar = () => {};
  if (D.cargado === cod && !manual) return;
  try {
    const r = await fetch(`d/${cod}.json`, { cache: 'no-store' }); if (!r.ok) throw 0; const o = await r.json(); if (!o || !o.rutina || !Array.isArray(o.regs)) throw 0;
    const enArchivo = new Set(o.regs.map((x) => x.fecha)), propios = D.regs.filter((x) => !enArchivo.has(x.fecha));
    const regs = [...o.regs, ...propios].sort((a, b) => a.fecha.localeCompare(b.fecha));
    const sesiones = [...(o.sesiones || []), ...D.sesiones.filter((x) => !enArchivo.has(x.fecha))].sort((a, b) => a.fecha.localeCompare(b.fecha));
    const pesos = [...(o.peso || []), ...D.peso.filter((x) => !(o.peso || []).some((y) => y.fecha === x.fecha))].sort((a, b) => a.fecha.localeCompare(b.fecha));
    // los nombres de los días que había (en el móvil y en el archivo) se guardan para que el historial no cambie de nombre
    const viejos = { ...(D.diasViejos || {}), ...Object.fromEntries((D.rutina.dias || []).map((d) => [d.id, d.nombre])), ...(o.diasViejos || {}) };
    for (const d of o.rutina.dias) for (const e of d.ejercicios) { if (Array.isArray(e.alt)) { const c = new Set(regs.map((x) => x.ej)); const id = [e.id, ...e.alt].find((x) => c.has(x)); if (id) e.id = id; delete e.alt; } }
    D = { ...nuevo(), ...D, logros: null, prVersion: 3, rutina: o.rutina, regs, sesiones, peso: pesos, cargado: cod, diasViejos: viejos, rutinaDesde: o.rutinaDesde || D.rutinaDesde || null, etapas: o.etapasV === 1 && Array.isArray(o.etapas) ? o.etapas : [], etapasV: o.etapasV === 1 ? 1 : 0, musculos: { ...(D.musculos || {}), ...(o.musculos || {}) }, hoyDia: null, rutinaCargada: o.rutinaCodigo || D.rutinaCargada }; recalcularRecords(); revisarLogros(true); guardar(); pintar();
    toast(`Cargados tus ${fechasEntreno().length} entrenos`); setTimeout(() => window.bichoDecir && window.bichoDecir('¡Ya tengo todo tu historial! Mira en Progreso cuánto has subido.', 7), 2500);
  } catch { limpiar(); toast('No he podido cargar los datos de este enlace'); }
}
cargarCodigo(new URLSearchParams(location.search).get('cargar'));
async function cargarRutina(cod) {
  if (!cod || !/^[a-z0-9]{6,20}$/.test(cod) || D.rutinaCargada === cod) return;
  try {
    const r = await fetch(`d/r-${cod}.json`, { cache: 'no-store' }); if (!r.ok) throw 0; const o = await r.json(); if (!o || !o.rutina || !Array.isArray(o.rutina.dias)) throw 0;
    const conocidos = new Set(D.regs.map((x) => x.ej));
    for (const d of o.rutina.dias) for (const e of d.ejercicios) { if (Array.isArray(e.alt)) { const id = [e.id, ...e.alt].find((x) => conocidos.has(x)); if (id) e.id = id; delete e.alt; } }
    D.diasViejos = { ...(D.diasViejos || {}), ...Object.fromEntries(D.rutina.dias.map((d) => [d.id, d.nombre])) }; D.rutinaDesde = hoy();
    asegurarEtapas(); const l = etapas();
    if (D.regs.some((r) => r.series.length && r.fecha >= (l.at(-1).desde || '')) && l.at(-1).desde < hoy()) { nuevaEtapa(`Rutina ${l.length + 1}`, hoy(), false); D.rutina = { ...o.rutina, nombre: D.rutina.nombre, desde: D.rutina.desde }; }
    else D.rutina = { ...o.rutina, nombre: D.rutina.nombre, desde: D.rutina.desde };
    D.hoyDia = null; D.rutinaCargada = cod; guardar(); pintar();
    toast('Rutina nueva puesta. Tus entrenos siguen igual'); setTimeout(() => window.bichoDecir && window.bichoDecir(`Rutina nueva. Hoy toca ${hoyDescanso() ? 'descansar' : diaPorId(diaDeHoy())?.nombre.toLowerCase()}. A por ello.`, 6), 2000);
  } catch { toast('No he podido cargar la rutina de este enlace'); }
}
cargarRutina(new URLSearchParams(location.search).get('rutina'));
if (D.prVersion !== 3) { recalcularRecords(); D.prVersion = 3; D.logros = null; guardar(); }
if (!D.logros) revisarLogros(true);
pintar();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
